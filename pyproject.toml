[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-maintainer-agent"
version = "0.4.0"
description = "A safe, observable agent for maintaining local code repositories"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Zh0uHX"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/Zh0uHX/repo-maintainer-agent"
Repository = "https://github.com/Zh0uHX/repo-maintainer-agent"
Issues = "https://github.com/Zh0uHX/repo-maintainer-agent/issues"

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["httpx>=0.28", "pytest>=8.0", "ruff>=0.8"]

[project.scripts]
repoagent = "repoagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["repoagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated"
]
